spring.application.name=LeaderBoardAPI

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://db:3306/leaderboard
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql:true

### Producer Config
spring.kafka.producer.properties.json.fail.invalid.schema=true
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.use.latest.version=true
spring.kafka.producer.properties.latest.compatibility.strict=false
spring.kafka.producer.properties.json.default.property.inclusion=NON_NULL
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
spring.kafka.properties.schema.registry.url=http://localhost:9095

### Consumer Config
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
spring.kafka.consumer.properties.json.value.type=com.fasterxml.jackson.databind.JsonNode

spring.kafka.consumer.properties.max.poll.interval.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=2000
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.consumer.properties.json.fail.invalid.schema=true
